<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List | White & Orange Theme</title>
  <!-- Google Fonts for sleek modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Ambient Warm Orange & White Background Accents -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <main class="todo-app-card">
    <!-- App Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-box">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div>
          <h1>My Tasks</h1>
          <p class="subtitle">Stay productive & organize your daily goals</p>
        </div>
      </div>
      <div class="stats-badge" id="stats-badge">
        <span id="completed-count">0</span> / <span id="total-count">0</span> done
      </div>
    </header>

    <!-- Task Input Form (Hint 1 & 3: Input, Add button & Event listeners) -->
    <form id="todo-form" class="todo-form" autocomplete="off">
      <div class="input-container">
        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="16"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
        </svg>
        <input 
          type="text" 
          id="task-input" 
          placeholder="What needs to be done today?" 
          aria-label="New task input"
          maxlength="150"
          autofocus
        />
      </div>
      <button type="submit" id="add-btn" class="btn-add" aria-label="Add new task">
        <span>Add Task</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </form>

    <!-- Controls Bar: Filter tabs & Clear button -->
    <div class="controls-bar">
      <div class="filter-tabs" role="tablist" aria-label="Task status filters">
        <button type="button" class="tab-btn active" data-filter="all">All</button>
        <button type="button" class="tab-btn" data-filter="active">Active</button>
        <button type="button" class="tab-btn" data-filter="completed">Completed</button>
      </div>
      <button type="button" id="clear-completed" class="btn-clear" title="Remove all completed tasks">
        Clear Completed
      </button>
    </div>

    <!-- Task List Container (Hint 1 & 4: Append new tasks dynamically) -->
    <section class="task-section">
      <ul id="task-list" class="task-list" aria-live="polite">
        <!-- List items rendered dynamically via JavaScript -->
      </ul>

      <!-- Empty State Indicator -->
      <div id="empty-state" class="empty-state">
        <div class="empty-icon-wrap">
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <h3>No tasks to display</h3>
        <p>Add a new task above or adjust your filter.</p>
      </div>
    </section>

    <!-- Footer Summary Info -->
    <footer class="app-footer">
      <span id="items-left-count" class="items-left">0 active tasks</span>
      <span class="hint-pill">Tip: Click task to toggle completion</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
